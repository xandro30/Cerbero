[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Duplicates that no published release removes, each with where it lives.
skip = [
    { crate = "hashbrown@0.16", reason = "libflate_lz77 2.3.0, the latest, still on 0.16; only the build script of libsodium-sys-stable uses it to unpack libsodium" },
    { crate = "syn@2", reason = "the proc-macros of tracing-attributes 0.1.31 and zeroize_derive 1.5.0, the latest, still on syn 2, while serde, clap, thiserror and tokio use syn 3" },
    { crate = "base64@0.22", reason = "jsonwebtoken 11.1.0, the latest, still on base64 0.22, while pem 4.0.0 (from rcgen) and the build script of libsodium-sys-stable use 0.23" },
    { crate = "untrusted@0.7", reason = "aws-lc-rs 1.19.0, the latest, still on untrusted 0.7, while rustls-webpki 0.103.16, the latest stable, uses 0.9; both reach the binary" },
    { crate = "getrandom@0.2", reason = "jsonwebtoken 11.1.0, the latest, pulls it only on targets Hécate does not build for; never compiled for macOS or Linux" },
    { crate = "getrandom@0.3", reason = "ahash 0.8.12 and referencing 0.61.0, the latest, through jsonschema, which only the contract tests use (test-support)" },
    { crate = "r-efi@5", reason = "getrandom 0.3 pulls it only on UEFI targets, through jsonschema in the contract tests; never compiled for macOS or Linux" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
