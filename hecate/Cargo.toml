[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
hecate-domain = { path = "crates/domain" }
hecate-application = { path = "crates/application" }
hecate-infrastructure = { path = "crates/infrastructure" }
aws-lc-rs = "1.19.0"
libsodium-rs = "0.3.1"
vsss-rs = { version = "6.0.1", default-features = false, features = ["std", "zeroize"] }
rand_core = "0.10.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["derive"] }
data-encoding = "2.11.1"
nix = { version = "0.31.3", features = ["term", "resource", "mman", "socket", "signal", "user", "fs"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
axum = { version = "0.8.9", default-features = false }
hyper = { version = "1.12.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "service"] }
tower = "0.5.3"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "prefer-post-quantum"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser", "zeroize"] }
x509-parser = { version = "0.18.1", features = ["verify-aws"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["aws-lc-rs", "http1", "http2"] }
jsonschema = { version = "0.61.0", default-features = false, features = ["resolve-file"] }
proptest = "1.12.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 3
